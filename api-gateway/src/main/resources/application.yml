spring:
  application:
    name: api-gateway
  cloud:
    gateway:


      routes:
        - id: identity-service
          uri: lb://identity-service  # "lb://" signifie Load Balancer via Eureka !
          predicates:
            - Path=/api/auth/**, /api/users/**  # Routes à rediriger vers Identity

          # --- Collection Service (à ajouter) ---
        - id: collection-service
          uri: lb://collection-service
          predicates:
            - Path=/api/farmers/**,/api/collections/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 9000  # La Gateway écoutera sur le port 9000
